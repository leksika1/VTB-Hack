# Весь стек одной командой — для локального запуска и CI. В Dokploy — два сервиса из
# backend/docker-compose.yml и frontend/docker-compose.yml (docs/OPERATIONS.md); определения держать в согласии.
# Переменные — в файле .env рядом (см. .env.example):
#   POSTGRES_PASSWORD, REDIS_PASSWORD — обязательны, только латиница и цифры (входят в URL подключения)
#   CORS_ORIGINS — домены фронтенда, если он ходит в API с другого домена

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  frontend:
    <<: *hardening
    build:
      context: ./frontend
    expose:
      - "80"
    mem_limit: 128m
    networks: [edge]

  backend:
    <<: *hardening
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://family:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@db:5432/family
      REDIS_URL: redis://:${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TIMEZONE: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks: [edge, data]

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    networks: [data]

  # Только счётчики лимитов и рассылка событий — ничего, что жалко потерять, поэтому без записи на диск
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks: [data]

networks:
  # nginx ↔ backend
  edge:
  # backend ↔ PostgreSQL, Redis. Внутренняя: без выхода наружу, nginx в неё не входит
  data:
    internal: true

volumes:
  pgdata:
