# Сервис «Backend» в Dokploy: backend + PostgreSQL + Redis (Compose Path: ./backend/docker-compose.yml).
# Фронтенд — отдельный сервис (frontend/docker-compose.yml) — ходит сюда через общую сеть Dokploy
# по имени BACKEND_ALIAS. База и Redis — только во внутренней сети, снаружи и фронтенду не видны.
# Определения совпадают с корневым docker-compose.yml (локальный запуск и CI) — меняйте оба файла.
#
# Environment в Dokploy (обязательные; пароли — только латиница и цифры):
#   POSTGRES_PASSWORD, REDIS_PASSWORD
#   BACKEND_ALIAS     — уникальное имя на сервере: family-backend-prod / family-backend-dev
#   CORS_ORIGINS      — домен фронтенда, если он ходит в API с другого домена
# Необязательные (вход через ВТБ ID, витрина, лимиты, почта) перечислены в environment ниже:
# заданные в Dokploy, они доходят до backend только потому, что есть в этом списке

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  backend:
    <<: *hardening
    build:
      context: .
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://family:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@db:5432/family
      REDIS_URL: redis://:${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TIMEZONE: Europe/Moscow
      # Необязательные: значения по умолчанию — как в app/config.py (docs/OPERATIONS.md)
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_INVITE: ${RATE_LIMIT_INVITE:-120}
      RATE_LIMIT_SIGNUP: ${RATE_LIMIT_SIGNUP:-60}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-120}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-600}
      DEMO_TTL_HOURS: ${DEMO_TTL_HOURS:-24}
      SEED_SHOWCASE: ${SEED_SHOWCASE:-false}
      SHOWCASE_INVITE_CODE: ${SHOWCASE_INVITE_CODE:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_MOCK: ${OIDC_MOCK:-false}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-ВТБ ID}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-outbox}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Семейный бюджет <no-reply@example.ru>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks:
      data: {}
      shared:
        aliases:
          - ${BACKEND_ALIAS:?Задайте BACKEND_ALIAS (family-backend-prod / family-backend-dev)}

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    networks: [data]

  # Только счётчики лимитов и рассылка событий — без записи на диск
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Задайте REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks: [data]

networks:
  # backend ↔ PostgreSQL, Redis. Внутренняя: без выхода наружу
  data:
    internal: true
  # Общая сеть Dokploy — через неё фронтенд из другого сервиса находит backend по BACKEND_ALIAS
  shared:
    external: true
    name: ${SHARED_NETWORK:-dokploy-network}

volumes:
  pgdata:
