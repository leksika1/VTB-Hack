# Сервис «Frontend» в Dokploy: только nginx с собранным фронтендом (Compose Path: ./frontend/docker-compose.yml).
# /api проксируется в сервис «Backend» (backend/docker-compose.yml) через общую сеть Dokploy.
# Domains в Dokploy: домен → сервис frontend, порт 80.
#
# Environment в Dokploy:
#   BACKEND_ALIAS — то же значение, что у сервиса Backend: family-backend-prod / family-backend-dev
# Необязательные — лимиты nginx с одного IP (по умолчанию как в Dockerfile, docs/OPERATIONS.md)

services:
  frontend:
    build:
      context: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    expose:
      - "80"
    environment:
      BACKEND_UPSTREAM: http://${BACKEND_ALIAS:?Задайте BACKEND_ALIAS (как у сервиса Backend)}:8000
      API_RATE: ${API_RATE:-50r/s}
      API_BURST: ${API_BURST:-200}
      STATIC_RATE: ${STATIC_RATE:-100r/s}
      CONN_PER_IP: ${CONN_PER_IP:-300}
      EVENTS_PER_IP: ${EVENTS_PER_IP:-150}
    mem_limit: 128m
    networks: [shared]

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-dokploy-network}
