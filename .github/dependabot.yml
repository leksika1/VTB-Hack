# Еженедельные PR с обновлениями зависимостей — уязвимости закрываются без ручного слежения
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
