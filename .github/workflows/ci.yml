name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сюда добавить линтер и тесты бэкенда/фронтенда, когда появится код
      - name: Build images
        run: docker compose build

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Окружения dev/prod в Settings → Environments, в каждом секреты
    # DOKPLOY_WEBHOOK_FRONTEND и DOKPLOY_WEBHOOK_BACKEND (Dokploy → сервис → Deployments → Webhook URL)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      # Dokploy принимает вебхук только в формате push-события GitHub и на несовпадение
      # ветки отвечает 301, поэтому проверяем, что ответ именно 200
      - name: Trigger Dokploy deploy (${{ matrix.service }})
        env:
          WEBHOOK_URL: ${{ matrix.service == 'frontend' && secrets.DOKPLOY_WEBHOOK_FRONTEND || secrets.DOKPLOY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Секрет вебхука для ${{ matrix.service }} не задан в окружении"
            exit 1
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\": \"$GITHUB_REF\", \"head_commit\": {\"message\": \"CI deploy $GITHUB_SHA\"}, \"commits\": []}")
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy ответил $code"
            exit 1
          fi
