name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сюда добавить линтер и тесты бэкенда/фронтенда, когда появится код
      - name: Build images
        run: docker compose build

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Окружения dev/prod в Settings → Environments, в каждом свой секрет DOKPLOY_WEBHOOK_URL
    # (Dokploy → Compose-сервис → Deployments → Webhook URL)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      # Dokploy принимает вебхук только в формате push-события GitHub и на несовпадение
      # ветки отвечает 301, поэтому проверяем, что ответ именно 200
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\": \"$GITHUB_REF\", \"head_commit\": {\"message\": \"CI deploy $GITHUB_SHA\"}, \"commits\": []}")
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy ответил $code"
            exit 1
          fi
