name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Минимальные права токена GITHUB_TOKEN: только чтение кода
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: family
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U family" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://family:family@localhost:55432/family
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Известные уязвимости в зависимостях — сборка падает
      - run: pip-audit -r requirements.txt
      # unit + e2e на сервере в процессе; база создаётся миграциями
      - run: pytest -q
      # Модели и миграции не разъехались
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://family:family@localhost:55432/family

  frontend-checks:
    name: frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  # Собирает образы, поднимает весь стек (nginx → 2 реплики backend → Postgres + Redis)
  # и прогоняет те же e2e-тесты по HTTP через nginx
  build:
    # Имя "build" — его требует правило защиты веток на GitHub (required status check); не переименовывать
    name: build
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: family
      REDIS_PASSWORD: family
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Build images
        run: $COMPOSE build

      - name: Start stack
        run: $COMPOSE up -d --wait

      - name: E2E tests against the stack
        working-directory: backend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_DATABASE_URL: postgresql+asyncpg://family:family@127.0.0.1:55433/family
        run: |
          pip install -r requirements-dev.txt
          pytest -q tests/e2e

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Окружения dev/prod в Settings → Environments, в каждом секреты
    # DOKPLOY_WEBHOOK_FRONTEND и DOKPLOY_WEBHOOK_BACKEND (Dokploy → сервис → Deployments → Webhook URL)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      # Dokploy принимает вебхук только в формате push-события GitHub и на несовпадение
      # ветки отвечает 301, поэтому проверяем, что ответ именно 200
      - name: Trigger Dokploy deploy (${{ matrix.service }})
        env:
          WEBHOOK_URL: ${{ matrix.service == 'frontend' && secrets.DOKPLOY_WEBHOOK_FRONTEND || secrets.DOKPLOY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Секрет вебхука для ${{ matrix.service }} не задан в окружении"
            exit 1
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\": \"$GITHUB_REF\", \"head_commit\": {\"message\": \"CI deploy $GITHUB_SHA\"}, \"commits\": []}")
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy ответил $code"
            exit 1
          fi
